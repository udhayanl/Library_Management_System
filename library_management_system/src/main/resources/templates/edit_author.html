<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Author</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/books">The Stacks<small>Library desk</small></a><p class="nav-label">Manage</p><a class="nav-link" href="/books">&#9632; Books</a><a class="nav-link active" href="/author-view">&#9670; Authors</a><a class="nav-link" href="/member-view">&#9679; Members</a></aside><main class="content"><div class="content-inner"><div class="form-card">
    <p class="eyebrow">Catalogue record</p><h1>Edit author</h1><p class="intro">Refine the details for this author.</p>
    <form th:action="@{/author-view/update/{id}(id=${author.id})}"
          th:object="${author}"
          method="post">
        <div class="form-group">
            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}">
            <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="form-group">
            <label for="country">Country</label>
            <input id="country" type="text" th:field="*{country}">
            <p class="error" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></p>
        </div>

        <div class="form-actions"><button type="submit" class="btn">Update author</button><a href="/author-view" class="cancel">Cancel</a></div>
    </form></div></div></main></div>
</body>
</html>
