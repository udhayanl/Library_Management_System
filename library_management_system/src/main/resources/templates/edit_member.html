<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Edit Member | The Stacks</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/books">The Stacks<small>Library desk</small></a><p class="nav-label">Manage</p><a class="nav-link" href="/books">&#9632; Books</a><a class="nav-link" href="/author-view">&#9670; Authors</a><a class="nav-link active" href="/member-view">&#9679; Members</a></aside><main class="content"><div class="content-inner"><div class="form-card"><p class="eyebrow">Directory record</p><h1>Edit member</h1><p class="intro">Keep this reader's contact details current.</p><form th:action="@{/member-view/update/{id}(id=${member.id})}" th:object="${member}" method="post"><div class="form-group"><label for="name">Full name</label><input id="name" type="text" th:field="*{name}" required></div><div class="form-group"><label for="email">Email address</label><input id="email" type="email" th:field="*{email}" required></div><div class="form-group"><label for="phoneNumber">Phone number</label><input id="phoneNumber" type="tel" th:field="*{phoneNumber}" required></div><div class="form-actions"><button type="submit" class="btn">Update member</button><a href="/member-view" class="cancel">Cancel</a></div></form></div></div></main></div></body>
